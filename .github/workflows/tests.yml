name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.10 legs run without django-bolt (marker gate) — test core provider logic only
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.1"]
        exclude:
          - python-version: "3.10"
            django-version: "6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv pip install "Django~=${{ matrix.django-version }}.0"
      - run: uv run ruff check .
      - run: uv run pytest -q
